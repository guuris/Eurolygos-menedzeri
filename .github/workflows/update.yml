name: Atnaujinti Eurolygos menedzerį
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/update.mjs
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
      - run: |
          git config user.name "Eurolygos menedzeris bot"
          git config user.email "actions@github.com"
          git add data/league.json
          git diff --cached --quiet || git commit -m "Auto: atnaujinti menedzerio duomenis"
          git push