<!doctype html>
<html lang="lt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Eurolygos menedžeris</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="brand"><div class="brand-mark">EM</div><div><strong>EUROLYGOS</strong><span>MENEDŽERIS</span></div></div>
<nav><button data-view="home" class="active">⌂ Pradžia</button><button data-view="standings">🏆 Lentelė</button><button data-view="schedule">▦ Tvarkaraštis</button><button data-view="results">≡ Rezultatai</button><button data-view="teams">◉ Komandos</button></nav>
<button id="adminBtn" class="admin" type="button">A <span>Admin<br><small>⚙ Atnaujinti taškus</small></span></button></header>
<main><div id="status" class="notice">Kraunama...</div><section class="hero"><div><b id="heroRound">KRAUNAMA</b><h1 id="heroTitle">Iki turo pradžios</h1></div><div id="countdown" class="countdown">-- d. -- val. -- min.</div></section><div id="app"></div></main>
<div id="adminModal" class="modal" hidden><div class="modal-box"><button id="closeAdmin" class="modal-close" type="button">×</button><div class="eyebrow">ADMINISTRATORIUS</div><h2>Atnaujinti turo taškus</h2><p class="muted">Suveskite visų 20 vadybininkų taškus iš Krepsinis.net. Tada paspauskite „Pateikti taškus“.</p><label class="admin-label" for="adminRound">Turas</label><select id="adminRound"></select><div id="pointsRows" class="points-rows"></div><textarea id="pointsInput" rows="4" placeholder="arba įklijuokite: vadybininkas, taškai"></textarea><input id="pointsFile" type="file" accept=".txt,.csv,.json"><div class="admin-actions"><button id="applyPoints" class="primary" type="button">Pateikti taškus</button><button id="resetPoints" type="button">Anuliuoti šio turo taškus</button></div><p id="adminHelp" class="muted"></p></div></div>
<footer>Eurolygos menedžeris • 2026–2027 • automatinis atnaujinimas</footer><script src="app.js?v=20261001-standings2"></script><script>
(function(){
  async function showStandings(){
    try{
      const r=await fetch("./data/league.json?x="+Date.now());
      const d=await r.json();
      let rp={};
      try{
        const s=await fetch("https://ohazdehmrpvzotkxojtm.supabase.co/functions/v1/get-league-state?x="+Date.now());
        const j=await s.json(); rp=(j.data||j).roundPoints||{};
      }catch(e){}
      const totals={};
      d.teams.forEach(t=>totals[t.manager]={w:0,l:0,b:0,pts:0,totalManagerPoints:0,plusMinus:0});
      for(const r of d.rounds||[]){
        const p=rp[String(r.round)]||{};
        for(const g of r.pairings||[]){
          const a=Number(p[g.homeManager]),b=Number(p[g.awayManager]);
          if(!Number.isFinite(a)||!Number.isFinite(b))continue;
          totals[g.homeManager].totalManagerPoints+=a;
          totals[g.awayManager].totalManagerPoints+=b;
          totals[g.homeManager].plusMinus+=a-b;
          totals[g.awayManager].plusMinus+=b-a;
          if(a>b){totals[g.homeManager].w++;totals[g.homeManager].pts+=3;totals[g.awayManager].l++}
          else if(b>a){totals[g.awayManager].w++;totals[g.awayManager].pts+=3;totals[g.homeManager].l++}
        }
        const vals=Object.values(p).map(Number).filter(Number.isFinite);
        if(vals.length){
          const max=Math.max(...vals);
          d.teams.forEach(t=>{if(Number(p[t.manager])===max){totals[t.manager].b++;totals[t.manager].pts++}});
        }
      }
      const rows=d.teams.map(t=>({...t,...totals[t.manager]})).sort((a,b)=>b.pts-a.pts||b.plusMinus-a.plusMinus);
      const html='<section class="card" id="standingsFallback"><div class="card-head"><div class="eyebrow">BENDRA ĮSKAITA</div><h2>Turnyro lentelė</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Komanda</th><th>Vadybininkas</th><th>W</th><th>L</th><th>B</th><th>Menedž. taškai</th><th>+/-</th><th>PTS</th></tr></thead><tbody>'+
        rows.map((t,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+t.team+'</b></td><td>'+t.manager+'</td><td class="num">'+t.w+'</td><td class="num">'+t.l+'</td><td class="num">'+t.b+'</td><td class="num">'+t.totalManagerPoints+'</td><td class="num">'+(t.plusMinus>0?'+':'')+t.plusMinus+'</td><td class="num score">'+t.pts+'</td></tr>').join('')+
        '</tbody></table></div></section>';
      const app=document.querySelector("#app");
      if(app && !app.querySelector(".table-wrap")) app.insertAdjacentHTML("beforeend",html);
    }catch(e){console.error("Lentelės atsarginis įkėlimas:",e)}
  }
  setTimeout(showStandings,800);
})();
</script></body></html>
